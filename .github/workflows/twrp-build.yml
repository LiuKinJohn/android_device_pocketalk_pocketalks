name: Build TWRP (Pocketalk S)

on:
  workflow_dispatch:
  push:
    branches:
      - android-8.1
    paths:
      - .github/workflows/twrp-build.yml
      - AndroidProducts.mk
      - BoardConfig.mk
      - omni_pocketalks.mk
      - recovery/**
      - prebuilt/**

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk and install dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y repo rsync git-lfs

      - name: Resolve available TWRP manifest branch
        run: |
          set -euo pipefail
          MANIFEST_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"

          mapfile -t REMOTE_BRANCHES < <(
            git ls-remote --heads "$MANIFEST_URL" \
              | awk '{print $2}' \
              | sed 's#refs/heads/##'
          )

          if [ "${#REMOTE_BRANCHES[@]}" -eq 0 ]; then
            echo "No remote branches found for $MANIFEST_URL" >&2
            exit 1
          fi

          PREFERRED=(
            "twrp-9.0"
            "twrp-10.0"
            "twrp-11.0"
            "twrp-11"
            "twrp-12.1"
            "twrp-13.0"
            "twrp-14.0"
          )

          SELECTED=""
          for b in "${PREFERRED[@]}"; do
            if printf '%s\n' "${REMOTE_BRANCHES[@]}" | grep -qx "$b"; then
              SELECTED="$b"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            # Fallback: pick the newest twrp-* branch if preferred list is unavailable.
            SELECTED=$(printf '%s\n' "${REMOTE_BRANCHES[@]}" | grep '^twrp-' | sort -Vr | head -n1 || true)
          fi

          if [ -z "$SELECTED" ]; then
            echo "No twrp-* branch found at $MANIFEST_URL" >&2
            exit 1
          fi

          echo "MANIFEST_URL=$MANIFEST_URL" >> "$GITHUB_ENV"
          echo "MANIFEST_BRANCH=$SELECTED" >> "$GITHUB_ENV"
          echo "Using manifest branch: $SELECTED"

      - name: Extract kernel from stock boot image
        run: |
          python3 - << 'PY'
          import os
          import struct

          boot_img = "prebuilt/boot-stock.bin"
          out_kernel = "prebuilt/kernel"

          with open(boot_img, "rb") as f:
              data = f.read()

          if data[:8] != b"ANDROID!":
              raise SystemExit("Invalid boot image magic in prebuilt/boot-stock.bin")

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          page_size = struct.unpack_from("<I", data, 36)[0]

          if page_size == 0:
              raise SystemExit("Invalid page_size=0 in boot header")

          kernel_offset = page_size
          kernel_end = kernel_offset + kernel_size

          if kernel_end > len(data):
              raise SystemExit("Kernel range exceeds boot image size")

          os.makedirs(os.path.dirname(out_kernel), exist_ok=True)
          with open(out_kernel, "wb") as f:
              f.write(data[kernel_offset:kernel_end])

          print(f"Extracted kernel_size={kernel_size} page_size={page_size} -> {out_kernel}")
          PY

      - name: Init TWRP source
        run: |
          mkdir -p "$HOME/twrp-src"
          cd "$HOME/twrp-src"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
          repo sync -c --no-clone-bundle --no-tags -j"$(nproc --all)"

      - name: Inject device tree
        run: |
          cd "$HOME/twrp-src"
          mkdir -p device/pocketalk/pocketalks
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            "$GITHUB_WORKSPACE/" device/pocketalk/pocketalks/

      - name: Build recovery image
        run: |
          set -o pipefail
          cd "$HOME/twrp-src"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_pocketalks-eng
          mka recoveryimage -j"$(nproc --all)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out-artifacts"
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "collected_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$GITHUB_WORKSPACE/out-artifacts/run-info.txt"
          if [ -f "$HOME/twrp-src/out/target/product/pocketalks/recovery.img" ]; then
            cp "$HOME/twrp-src/out/target/product/pocketalks/recovery.img" "$GITHUB_WORKSPACE/out-artifacts/"
          fi
          if [ -f "$HOME/twrp-src/out/target/product/pocketalks/recovery.log" ]; then
            cp "$HOME/twrp-src/out/target/product/pocketalks/recovery.log" "$GITHUB_WORKSPACE/out-artifacts/"
          fi
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/out-artifacts/"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: twrp-pocketalks-${{ github.run_id }}
          path: out-artifacts/
          if-no-files-found: warn
