name: Build TWRP (Pocketalk S)

on:
  workflow_dispatch:
  push:
    branches:
      - android-8.1
    paths:
      - .github/workflows/twrp-build.yml
      - AndroidProducts.mk
      - BoardConfig.mk
      - omni_pocketalks.mk
      - recovery/**
      - prebuilt/**

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk and install dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y repo rsync git-lfs

      - name: Resolve available TWRP manifest branch
        run: |
          set -euo pipefail
          MANIFEST_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git"

          mapfile -t REMOTE_BRANCHES < <(
            git ls-remote --heads "$MANIFEST_URL" \
              | awk '{print $2}' \
              | sed 's#refs/heads/##'
          )

          if [ "${#REMOTE_BRANCHES[@]}" -eq 0 ]; then
            echo "No remote branches found for $MANIFEST_URL" >&2
            exit 1
          fi

          PREFERRED=(
            "twrp-9.0"
            "twrp-10.0"
            "twrp-11.0"
            "twrp-11"
            "twrp-12.1"
            "twrp-13.0"
            "twrp-14.0"
          )

          SELECTED=""
          for b in "${PREFERRED[@]}"; do
            if printf '%s\n' "${REMOTE_BRANCHES[@]}" | grep -qx "$b"; then
              SELECTED="$b"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            # Fallback: pick the newest twrp-* branch if preferred list is unavailable.
            SELECTED=$(printf '%s\n' "${REMOTE_BRANCHES[@]}" | grep '^twrp-' | sort -Vr | head -n1 || true)
          fi

          if [ -z "$SELECTED" ]; then
            echo "No twrp-* branch found at $MANIFEST_URL" >&2
            exit 1
          fi

          echo "MANIFEST_URL=$MANIFEST_URL" >> "$GITHUB_ENV"
          echo "MANIFEST_BRANCH=$SELECTED" >> "$GITHUB_ENV"
          echo "Using manifest branch: $SELECTED"

      - name: Extract kernel from stock boot image
        run: |
          python3 - << 'PY'
          import os
          import struct

          boot_img = "prebuilt/boot-stock.bin"
          out_kernel = "prebuilt/kernel"

          with open(boot_img, "rb") as f:
              data = f.read()

          if data[:8] != b"ANDROID!":
              raise SystemExit("Invalid boot image magic in prebuilt/boot-stock.bin")

          kernel_size = struct.unpack_from("<I", data, 8)[0]
          page_size = struct.unpack_from("<I", data, 36)[0]

          if page_size == 0:
              raise SystemExit("Invalid page_size=0 in boot header")

          kernel_offset = page_size
          kernel_end = kernel_offset + kernel_size

          if kernel_end > len(data):
              raise SystemExit("Kernel range exceeds boot image size")

          os.makedirs(os.path.dirname(out_kernel), exist_ok=True)
          with open(out_kernel, "wb") as f:
              f.write(data[kernel_offset:kernel_end])

          print(f"Extracted kernel_size={kernel_size} page_size={page_size} -> {out_kernel}")
          PY

      - name: Init TWRP source
        run: |
          mkdir -p "$HOME/twrp-src"
          cd "$HOME/twrp-src"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
          repo sync -c --no-clone-bundle --no-tags -j"$(nproc --all)"

      - name: Inject device tree
        run: |
          cd "$HOME/twrp-src"
          mkdir -p device/pocketalk/pocketalks
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            "$GITHUB_WORKSPACE/" device/pocketalk/pocketalks/

          # Safety rewrite in case stale variants are reintroduced by future edits.
          sed -i 's/^TARGET_ARCH_VARIANT := armv7-a-neon$/TARGET_ARCH_VARIANT := armv8-a/' \
            device/pocketalk/pocketalks/BoardConfig.mk || true

      - name: Preflight sanity checks
        run: |
          set -euo pipefail
          cd "$HOME/twrp-src"

          test -f vendor/twrp/config/common.mk
          test -f device/pocketalk/pocketalks/BoardConfig.mk
          test -f device/pocketalk/pocketalks/AndroidProducts.mk
          test -f device/pocketalk/pocketalks/omni_pocketalks.mk
          test -f device/pocketalk/pocketalks/prebuilt/kernel
          test -f device/pocketalk/pocketalks/recovery/root/etc/recovery.fstab

          echo "=== BoardConfig key values ==="
          grep -E '^(TARGET_ARCH|TARGET_ARCH_VARIANT|TARGET_CPU_ABI|TARGET_PREBUILT_KERNEL|BOARD_KERNEL_PAGESIZE|BOARD_BOOTIMAGE_PARTITION_SIZE|BOARD_RECOVERYIMAGE_PARTITION_SIZE|BOARD_INCLUDE_DTB_IN_BOOTIMG)' \
            device/pocketalk/pocketalks/BoardConfig.mk || true

          if grep -q '^TARGET_ARCH_VARIANT := armv7-a-neon' device/pocketalk/pocketalks/BoardConfig.mk; then
            echo "Invalid TARGET_ARCH_VARIANT for current source base: armv7-a-neon" >&2
            exit 1
          fi

          if grep -q '^BOARD_INCLUDE_DTB_IN_BOOTIMG := true' device/pocketalk/pocketalks/BoardConfig.mk; then
            echo "BOARD_INCLUDE_DTB_IN_BOOTIMG is true; dtb.img build rule must exist or recovery build will fail." >&2
          fi

          echo "=== Any remaining armv7-a-neon references under device tree ==="
          grep -R --line-number --fixed-strings 'armv7-a-neon' device/pocketalk/pocketalks || true

      - name: Verify lunch and dumpvars
        run: |
          set -eo pipefail
          cd "$HOME/twrp-src"
          export ZSH_VERSION="${ZSH_VERSION-}"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true

          if lunch omni_pocketalks-eng; then
            echo "LUNCH_TARGET=omni_pocketalks-eng" >> "$GITHUB_ENV"
          elif lunch omni_pocketalks-userdebug; then
            echo "LUNCH_TARGET=omni_pocketalks-userdebug" >> "$GITHUB_ENV"
          else
            echo "Unable to lunch pocketalks product" >&2
            exit 1
          fi

          echo "Resolved TARGET_ARCH=$(get_build_var TARGET_ARCH)"
          echo "Resolved TARGET_ARCH_VARIANT=$(get_build_var TARGET_ARCH_VARIANT)"
          echo "Resolved TARGET_CPU_VARIANT=$(get_build_var TARGET_CPU_VARIANT)"

      - name: Build recovery image
        run: |
          set -o pipefail
          cd "$HOME/twrp-src"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch "$LUNCH_TARGET"

          MEM_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          JOBS=$(nproc --all)
          if [ "$MEM_KB" -lt 16777216 ]; then
            JOBS=6
          fi
          echo "Using parallel jobs: $JOBS (MemTotal=${MEM_KB}KB)"

          mka recoveryimage -j"$JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out-artifacts"
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "collected_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$GITHUB_WORKSPACE/out-artifacts/run-info.txt"
          if [ -f "$HOME/twrp-src/out/target/product/pocketalks/recovery.img" ]; then
            cp "$HOME/twrp-src/out/target/product/pocketalks/recovery.img" "$GITHUB_WORKSPACE/out-artifacts/"
          fi
          if [ -f "$HOME/twrp-src/out/target/product/pocketalks/recovery.log" ]; then
            cp "$HOME/twrp-src/out/target/product/pocketalks/recovery.log" "$GITHUB_WORKSPACE/out-artifacts/"
          fi
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/out-artifacts/"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: twrp-pocketalks-${{ github.run_id }}
          path: out-artifacts/
          if-no-files-found: warn
